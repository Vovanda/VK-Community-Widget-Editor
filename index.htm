<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор виджета ВК сообщества</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">
  <header class="app-head">
    <h1>Редактор виджета ВК сообщества</h1>
    <p id="vkStatus" class="vk-status" role="status">Подключаюсь к VK…</p>
  </header>

  <div class="workspace">
    <div class="toolbar" role="toolbar" aria-label="Код виджета">
      <div class="tool-group">
        <button type="button" id="undoBtn" title="Отменить (Ctrl+Z)" aria-label="Отменить"><i class="fa fa-arrow-left" aria-hidden="true"></i></button>
        <button type="button" id="redoBtn" title="Повторить (Ctrl+Y)" aria-label="Повторить"><i class="fa fa-arrow-right" aria-hidden="true"></i></button>
        <label class="visually-hidden" for="widgetType">Тип виджета</label>
        <select id="widgetType" title="Тип виджета"></select>
      </div>
      <div class="tool-group">
        <button type="button" id="randomBtn" title="Вставить в начало генератор случайных чисел на VKScript" aria-label="Случайность"><i class="fa fa-dice" aria-hidden="true"></i></button>
        <button type="button" id="templateBtn" title="Заменить код примером для выбранного типа" aria-label="Шаблон"><i class="fa fa-file-code" aria-hidden="true"></i></button>
        <button type="button" id="formatBtn" title="Форматировать код" aria-label="Форматировать"><i class="fa fa-brush" aria-hidden="true"></i></button>
      </div>
      <div class="tool-group">
        <button type="button" id="permissionBtn" disabled title="Права на виджет: разрешить приложению обновлять виджет сообщества" aria-label="Права на виджет"><i class="fa fa-users-cog" aria-hidden="true"></i></button>
        <button type="button" id="previewBtn" class="primary" disabled title="Предпросмотр (Ctrl+Enter)" aria-label="Предпросмотр"><i class="fa fa-eye" aria-hidden="true"></i></button>
      </div>
    </div>
    <textarea id="editor" aria-label="Код виджета на VKScript"></textarea>
  </div>

  <section id="log" class="log" aria-labelledby="logTitle" hidden>
    <div class="log-head">
      <h2 id="logTitle">Сообщения</h2>
      <button type="button" id="clearLogBtn" class="log-clear">Очистить</button>
    </div>
    <ol id="logList" class="log-list" aria-live="polite"></ol>
  </section>

  <footer class="app-foot">
    <nav class="links" aria-label="Документация">
      <a href="https://dev.vk.com/ru/api/community-apps-widgets/getting-started" target="_blank" rel="noopener">Документация виджетов</a>
      <a href="https://dev.vk.com/ru/method/execute" target="_blank" rel="noopener">VKScript</a>
      <a href="https://gist.github.com/Vovanda/b47f75287542eb1f62704d5881b3d1d8" target="_blank" rel="noopener">Случайность в VKScript</a>
      <a href="https://vk.ru/cc" target="_blank" rel="noopener">VK CC</a>
    </nav>
    <p>Через <a href="https://vk.ru/cc" target="_blank" rel="noopener">VK CC</a> можно сокращать ссылки на внешние ресурсы и использовать их в виджетах.</p>
    <p class="credit">Автор: <a href="https://vk.com/super.volodya" target="_blank" rel="noopener">Володя Савкин</a></p>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/2.0.3/beautify.min.js"></script>
<script src="https://vk.com/js/api/openapi.js"></script>
<script src="https://vk.com/js/api/xd_connection.js"></script>
<script src="widget-editor.js"></script>

</body>
</html>
