<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор виджета ВК сообщества</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/codemirror-5.65.16/codemirror.min.css">
<link rel="stylesheet" href="vendor/font-awesome-6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">
  <header class="app-head">
    <h1>Редактор виджета ВК сообщества</h1>
    <p id="vkStatus" class="vk-status" role="status">Подключаюсь к VK…</p>
  </header>

  <div class="workspace">
    <div class="view-tabs" role="tablist" aria-label="Вид">
      <button type="button" role="tab" id="formTab" aria-selected="false" aria-controls="formView">Форма</button>
      <button type="button" role="tab" id="codeTab" aria-selected="true">Код</button>
    </div>
    <div class="toolbar" role="toolbar" aria-label="Код виджета">
      <div class="tool-group">
        <button type="button" id="undoBtn" aria-keyshortcuts="Control+Z"><i class="fa fa-arrow-left" aria-hidden="true"></i><span class="btn-label">Отменить</span></button>
        <button type="button" id="redoBtn" aria-keyshortcuts="Control+Y"><i class="fa fa-arrow-right" aria-hidden="true"></i><span class="btn-label">Повторить</span></button>
        <label class="visually-hidden" for="widgetType">Тип виджета</label>
        <select id="widgetType"></select>
      </div>
      <div class="tool-group">
        <div class="snippets">
          <button type="button" id="snippetsBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="snippetsMenu"><i class="fa fa-puzzle-piece" aria-hidden="true"></i><span class="btn-label">Сниппеты</span></button>
          <ul id="snippetsMenu" class="snippets-menu" role="menu" hidden></ul>
        </div>
        <button type="button" id="templateBtn"><i class="fa fa-file-code" aria-hidden="true"></i><span class="btn-label">Шаблон</span></button>
        <button type="button" id="formatBtn"><i class="fa fa-brush" aria-hidden="true"></i><span class="btn-label">Форматировать</span></button>
      </div>
      <div class="tool-group">
        <button type="button" id="permissionBtn" disabled><i class="fa fa-users-cog" aria-hidden="true"></i><span class="btn-label">Права на виджет</span></button>
        <button type="button" id="previewBtn" class="primary" disabled aria-keyshortcuts="Control+Enter"><i class="fa fa-eye" aria-hidden="true"></i><span class="btn-label">Предпросмотр</span></button>
      </div>
    </div>
    <textarea id="editor" aria-label="Код виджета на VKScript"></textarea>
    <div id="formView" class="form-view" role="tabpanel" aria-labelledby="formTab" hidden></div>
  </div>

  <section id="log" class="log" aria-labelledby="logTitle" hidden>
    <div class="log-head">
      <h2 id="logTitle">Сообщения</h2>
      <button type="button" id="clearLogBtn" class="log-clear">Очистить</button>
    </div>
    <ol id="logList" class="log-list" aria-live="polite"></ol>
  </section>

  <footer class="app-foot">
    <nav class="links" aria-label="Документация">
      <a href="https://dev.vk.com/ru/api/community-apps-widgets/getting-started" target="_blank" rel="noopener">Документация виджетов</a>
      <a href="https://dev.vk.com/ru/method/execute" target="_blank" rel="noopener">VKScript</a>
      <a href="https://gist.github.com/Vovanda/b47f75287542eb1f62704d5881b3d1d8" target="_blank" rel="noopener">Случайность в VKScript</a>
      <a href="https://vk.ru/cc" target="_blank" rel="noopener">VK CC</a>
    </nav>
    <p>Через <a href="https://vk.ru/cc" target="_blank" rel="noopener">VK CC</a> можно сокращать ссылки на внешние ресурсы и использовать их в виджетах.</p>
    <p class="credit">Автор: <a href="https://vk.com/super.volodya" target="_blank" rel="noopener">Володя Савкин</a></p>
  </footer>
</main>

<script src="vendor/codemirror-5.65.16/codemirror.min.js"></script>
<script src="vendor/codemirror-5.65.16/mode/javascript/javascript.min.js"></script>
<script src="vendor/codemirror-5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="vendor/codemirror-5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="vendor/js-beautify-2.0.3/beautify.min.js"></script>
<script src="https://vk.com/js/api/openapi.js"></script>
<script src="https://vk.com/js/api/xd_connection.js"></script>
<script src="vendor/acorn-8.18.0/acorn.js"></script>
<script src="widget-types.js"></script>
<script src="widget-form.js"></script>
<script src="widget-editor.js"></script>

</body>
</html>
