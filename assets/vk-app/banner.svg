<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 630" width="1120" height="630">
  <!-- Баннер 1120×630 для блока «Выбор редакции»: слева мотив иконки и что это,
       справа сама форма (screen-form.png, обрезана под вкладками — заголовок уже слева). -->
  <defs>
    <clipPath id="shot"><rect x="600" y="72" width="456" height="462" rx="4"/></clipPath>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b3d78" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1120" height="630" fill="#2688eb"/>

  <g transform="translate(64 72) scale(.8)">
    <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M34 24c-8 0-9 4-9 12v14c0 6-3 10-9 10 6 0 9 4 9 10v14c0 8 1 12 9 12"/>
      <path d="M86 24c8 0 9 4 9 12v14c0 6 3 10 9 10-6 0-9 4-9 10v14c0 8-1 12-9 12"/>
    </g>
    <g fill="#fff">
      <circle cx="44" cy="41" r="5"/><rect x="53" y="36" width="26" height="5" rx="2.5"/>
      <rect x="53" y="44" width="18" height="3.5" rx="1.75" opacity=".6"/>
      <circle cx="44" cy="60" r="5"/><rect x="53" y="55" width="22" height="5" rx="2.5"/>
      <rect x="53" y="63" width="24" height="3.5" rx="1.75" opacity=".6"/>
      <circle cx="44" cy="79" r="5"/><rect x="53" y="74" width="25" height="5" rx="2.5"/>
      <rect x="53" y="82" width="15" height="3.5" rx="1.75" opacity=".6"/>
    </g>
  </g>

  <g fill="#fff" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
    <text x="64" y="270" font-size="50" font-weight="700">
      <tspan x="64">Редактор виджета</tspan>
      <tspan x="64" dy="60">ВК сообщества</tspan>
    </text>
    <text x="64" y="410" font-size="24" opacity=".88">
      <tspan x="64">Все основные типы виджетов сообщества</tspan>
      <tspan x="64" dy="34">в одном редакторе. Визуальный</tspan>
      <tspan x="64" dy="34">конструктор помогает их наполнить.</tspan>
    </text>
    <!-- Кто сделал: проект, а не человек. Внизу слева, на уровне низа кадра справа. -->
    <text x="64" y="534" font-size="20">
      <tspan opacity=".72">Сделано в </tspan><tspan font-weight="700">sawking.tech</tspan>
    </text>
  </g>

  <rect x="600" y="72" width="456" height="462" rx="4" fill="#fff" filter="url(#lift)"/>
  <g clip-path="url(#shot)">
    <!-- Кадр 1300×1544: с 110 px (вкладки) до низа формы (~1430 px), в масштабе 456/1300. -->
    <image href="screen-form.png" xlink:href="screen-form.png" x="600" y="33.4" width="456" height="541.6"/>
  </g>
</svg>
